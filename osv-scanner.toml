# OSV scans the build dependencies in bun.lock. The extension does not ship them.
# The Firefox tool web-ext requires adbkit, which requires node-forge.
# Desktop lint, signing, and tests do not use the affected Android bridge.
# The dependency still exists on the build machine. This is a limited exception.
#
# The guard checks the exact package versions, integrity values, and consumers.
# It rejects new Android or bridge references. Other advisories still fail.
# Recheck upstream fixes before expiry. Remove this exception when a fix is used.
# Renewal needs owner approval after the 2026-10-20 review of this exact scope.
[[IgnoredVulns]]
id = "GHSA-86w9-cpqp-85rv"
ignoreUntil = 2026-10-28T00:00:00Z
reason = "No upstream fix. Current web-ext desktop lint/sign/test commands do not invoke adbkit TCP-USB RSA authentication; reviewed for web-ext 10.6.0 / adbkit 3.3.9 / node-forge 1.4.0. Not a general node-forge safety claim."
