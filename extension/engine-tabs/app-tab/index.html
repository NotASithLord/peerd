<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- why page-local: WebVM legitimately frames its packaged loader. Only the App parent rejects non-extension frame navigation. -->
  <meta http-equiv="Content-Security-Policy" content="frame-src 'self'">
  <title>peerd · App</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='2' width='12' height='12' rx='2' fill='%23a78bfa'/%3E%3Crect x='4' y='4' width='8' height='2' fill='%230d1117'/%3E%3Crect x='4' y='7' width='5' height='1' fill='%230d1117'/%3E%3Crect x='4' y='9' width='6' height='1' fill='%230d1117'/%3E%3C/svg%3E">
  <!--
    Trusted parent shell. Multi-file apps live in OPFS at
    peerd-apps/<appId>/. This page reads + composes them into a
    single HTML body and posts it to the sandboxed runner iframe.
    A toggle in the corner swaps to edit mode (peerd-engine/editor).
  -->
  <link rel="stylesheet" href="/shared/brand.css">
  <style>
    :root {
      --bg: #101112;
      --bg-elev: #151617;
      --bg-elev2: #1A1C1E;
      --bg-editor: #080909;
      --fg: #F3F3EF;
      --fg-muted: #ABABA6;
      --muted: #70716E;
      --border: #25272A;
      --border-strong: #32353A;
      --accent: #a78bfa;
      --fail: #c43030;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden; background: #fff; }
    body.mode-edit { background: var(--bg); }

    .frame-host { position: fixed; inset: 0; }
    #app-frame {
      width: 100%; height: 100%; border: 0; background: #fff; display: block;
    }

    /* Edit-mode panel — covers the iframe, full viewport. */
    #editor-panel {
      position: fixed; inset: 32px 0 0 0;
      background: var(--bg);
      display: flex; flex-direction: column;
      z-index: 20;
    }
    #editor-panel[hidden] { display: none; }
    #editor-mount { flex: 1 1 auto; display: flex; overflow: hidden; }

    /* Toolbar visible only in edit mode (the toggle button persists). */
    .edit-toolbar {
      position: fixed; top: 0; left: 0; right: 0;
      height: 32px;
      background: var(--bg-elev);
      border-bottom: 1px solid var(--border);
      display: none; align-items: center; gap: 8px;
      padding: 0 12px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--fg-muted);
      z-index: 21;
    }
    body.mode-edit .edit-toolbar { display: flex; }
    .edit-toolbar .app-dot {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; border-radius: 4px;
      background: var(--accent); color: var(--bg);
      font-weight: 700; font-size: 10px;
    }

    /* Trusted host controls in the top-right corner. */
    #mode-toggle, #export-btn, #actor-chat-toggle {
      position: fixed; top: 6px; right: 8px;
      z-index: 30;
      background: var(--bg-elev);
      color: var(--fg);
      border: 1px solid var(--border);
      font: inherit;
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 4px;
      cursor: pointer;
      opacity: 0.8;
    }
    #mode-toggle:hover { opacity: 1; border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
    /* Export sits left of the toggle; monochrome on hover too (the
       accent stays the toggle's). */
    #export-btn { right: 88px; }
    #export-btn:hover { opacity: 1; border-color: var(--fg-muted); }
    #export-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #actor-chat-toggle { right: 172px; }
    #actor-chat-toggle:hover, #actor-chat-toggle[aria-expanded="true"] {
      opacity: 1; border-color: var(--accent);
    }

    /* Host-owned App actor drawer. It sits outside the sandboxed iframe: App
       code can request that it open, but cannot read, populate, or submit it. */
    #actor-chat-drawer {
      position: fixed; top: 40px; right: 12px; bottom: 12px;
      width: min(400px, calc(100vw - 24px));
      z-index: 80;
      display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
      border: 1px solid var(--border-strong); border-radius: 10px;
      background: color-mix(in srgb, var(--bg-elev) 97%, transparent);
      color: var(--fg); box-shadow: 0 18px 60px rgba(0,0,0,.45);
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    #actor-chat-drawer[hidden] { display: none; }
    .actor-chat-header {
      display: flex; align-items: center; gap: 10px; padding: 11px 12px;
      border-bottom: 1px solid var(--border); background: var(--bg-elev2);
    }
    .actor-chat-title { flex: 1; min-width: 0; }
    .actor-chat-title strong, .actor-chat-title span { display: block; }
    .actor-chat-title span { color: var(--fg-muted); font-size: 11px; }
    #actor-chat-close {
      border: 0; background: transparent; color: var(--fg-muted);
      font-size: 20px; line-height: 1; cursor: pointer;
    }
    #actor-chat-messages {
      overflow: auto; padding: 14px; display: flex; flex-direction: column;
      gap: 10px; background: var(--bg);
    }
    .actor-chat-message {
      max-width: 92%; padding: 9px 11px; border: 1px solid var(--border);
      border-radius: 9px; white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .actor-chat-message[data-role="user"] {
      align-self: flex-end; background: color-mix(in srgb, var(--accent) 17%, var(--bg-elev));
      border-color: color-mix(in srgb, var(--accent) 42%, var(--border));
    }
    .actor-chat-message[data-role="actor"] { align-self: flex-start; background: var(--bg-elev); }
    .actor-chat-message[data-role="status"] { align-self: center; color: var(--fg-muted); font-size: 11px; }
    .actor-chat-compose {
      padding: 10px; border-top: 1px solid var(--border); background: var(--bg-elev2);
    }
    #actor-chat-input {
      display: block; width: 100%; min-height: 72px; max-height: 180px; resize: vertical;
      border: 1px solid var(--border-strong); border-radius: 7px;
      background: var(--bg-editor); color: var(--fg); padding: 9px 10px;
      font: inherit;
    }
    .actor-chat-actions { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    #actor-chat-status { flex: 1; color: var(--fg-muted); font-size: 11px; }
    #actor-chat-send {
      min-height: 30px; padding: 4px 12px; border: 1px solid var(--accent);
      border-radius: 5px; background: var(--accent); color: #101112; cursor: pointer;
      font-weight: 650;
    }
    #actor-chat-send:disabled { opacity: .5; cursor: default; }

    /* Boot overlay. */
    .boot {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 13px;
      z-index: 999;
      transition: opacity 200ms ease-out;
    }
    .boot.is-hidden { opacity: 0; pointer-events: none; }
    .boot.is-failed { background: #1a0e0e; }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid color-mix(in srgb, var(--accent) 25%, transparent);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.68s linear infinite;
    }
    .boot.is-failed .spinner {
      border-color: rgba(196, 48, 48, 0.5);
      border-top-color: var(--fail);
      animation: none;
    }
    #actor-retry {
      min-height: 34px; padding: 6px 14px;
      border: 1px solid #777; border-radius: 4px;
      background: #111; color: var(--fg); cursor: pointer;
    }
    #actor-retry[hidden] { display: none; }
    #actor-retry:disabled { opacity: 0.5; cursor: default; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .muted { color: var(--fg-muted); margin: 0; max-width: 360px; text-align: center; padding: 0 20px; }
    #app-notice-stack {
      position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 70;
      display: flex; flex-direction: column; gap: 8px;
      pointer-events: none;
    }
    #app-notice-stack > * { pointer-events: auto; }
    #app-save-status {
      display: flex; align-items: center; gap: 12px;
      padding: 9px 12px; border: 1px solid var(--fail); border-radius: 6px;
      background: #111; color: var(--fg);
      font: 12px/1.4 -apple-system, system-ui, sans-serif;
    }
    #app-save-status[hidden] { display: none; }
    #app-save-message { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    #app-save-retry {
      min-height: 28px; padding: 3px 10px;
      border: 1px solid #666; border-radius: 4px;
      background: #111; color: var(--fg); cursor: pointer;
    }
    #app-save-retry:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body class="mode-render">
  <div class="boot" id="boot">
    <div class="spinner"></div>
    <p class="muted" id="boot-msg">Loading…</p>
    <button id="actor-retry" type="button" hidden>Retry actor</button>
  </div>

  <div class="frame-host">
    <iframe id="app-frame" title="peerd app" sandbox="allow-scripts allow-modals allow-pointer-lock"></iframe>
  </div>

  <div class="edit-toolbar">
    <span class="peerd-brand" aria-hidden="true"><span class="b-p">p</span><span class="b-e">e</span><span class="b-e2">e</span><span class="b-r">r</span><span class="b-d">d</span></span>
    <span aria-hidden="true">·</span>
    <span class="app-dot" aria-hidden="true">◇</span>
    <span>app editor</span>
  </div>

  <div id="editor-panel" hidden>
    <div id="editor-mount"></div>
  </div>

  <div id="app-notice-stack">
    <div id="app-save-status" role="alert" aria-live="assertive" hidden>
      <span id="app-save-message"></span>
      <button id="app-save-retry" type="button">Retry save</button>
    </div>
  </div>

  <aside id="actor-chat-drawer" aria-label="App actor conversation" hidden>
    <div class="actor-chat-header">
      <div class="actor-chat-title">
        <strong id="actor-chat-name">App actor</strong>
        <span>Direct conversation · scoped to this App</span>
      </div>
      <button id="actor-chat-close" type="button" aria-label="Close App actor">×</button>
    </div>
    <div id="actor-chat-messages" role="log" aria-live="polite" aria-relevant="additions"></div>
    <div class="actor-chat-compose">
      <label for="actor-chat-input" class="muted" style="display:block;text-align:left;padding:0 0 6px;max-width:none">Message this App's actor</label>
      <textarea id="actor-chat-input" maxlength="12000" placeholder="Ask about the App, its state, or a change you want…"></textarea>
      <div class="actor-chat-actions">
        <span id="actor-chat-status">Enter to send · Shift+Enter for a new line</span>
        <button id="actor-chat-send" type="button">Send</button>
      </div>
    </div>
  </aside>

  <button id="actor-chat-toggle" type="button" title="Talk directly with this App's actor" aria-expanded="false">Actor ◇</button>
  <button id="export-btn" title="Download this app as a .peerd file">Export ⤓</button>
  <button id="mode-toggle" title="Toggle render / edit">Edit ✎</button>

  <script src="/engine-tabs/app-tab/app-tab.js" type="module"></script>
</body>
</html>
