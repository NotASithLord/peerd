<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--
    Sandboxed page (declared in manifest.json sandbox.pages). MV3
    strips ALL chrome.* APIs from sandboxed pages, but we get:
      - opaque origin
      - peerd's narrowed sandbox CSP, which allows inline <script>
      - postMessage with the parent window

    This page lives inside an iframe in app-tab/index.html. Its only
    job is to wait for the parent to postMessage the agent's HTML body
    and then document.write it -- replacing this page entirely with
    the agent's content. Inline <script> tags in the body execute
    because the sandbox CSP permits them.
  -->
</head>
<body>
<script>
  (() => {
    'use strict';
    // CSP does not consistently cover WebRTC's ICE/STUN path. Apps do not need
    // raw peer connections — dwapps reach the mesh through the trusted parent
    // bridge — so remove both constructor spellings before untrusted code runs.
    let realmSealed = true;
    for (const name of ['RTCPeerConnection', 'webkitRTCPeerConnection']) {
      try {
        Object.defineProperty(globalThis, name, {
          value: undefined, writable: false, configurable: false,
        });
      } catch (_e) { /* verified below — failure never falls through to App code */ }
      if (typeof globalThis[name] === 'function') realmSealed = false;
    }

    let initialized = false;
    window.addEventListener('message', (e) => {
      if (initialized || e.source !== window.parent) return;
      const msg = e.data;
      const port = e.ports?.[0];
      if (!msg || msg.type !== 'runner-init' || !port) return;
      initialized = true;
      if (!realmSealed) {
        port.postMessage({ type: 'runner-failed', reason: 'WebRTC could not be disabled.' });
        return;
      }
      let received = false;
      port.addEventListener('message', (bodyEvent) => {
        if (received) return;
        const msg = bodyEvent.data;
        if (!msg || msg.type !== 'app-body') return;
        received = true;

      const html = typeof msg.html === 'string'
        ? msg.html
        : '<p style="padding:40px;font-family:sans-serif">empty app</p>';

      // Binary App files arrive as transferred ArrayBuffers. Install the API on
      // the Window before document.write so App scripts can use it synchronously.
      // The App owns these buffers; the trusted parent re-reads OPFS for every
      // later delivery instead of attempting to reuse detached transfers.
      const receivedAssets = msg.assets && typeof msg.assets === 'object' ? msg.assets : {};
      const entry = typeof msg.entry === 'string' ? msg.entry : 'index.html';
      const assets = Object.create(null);
      for (const [path, value] of Object.entries(receivedAssets)) {
        if (value instanceof ArrayBuffer) assets[path] = value;
      }
      const MIME = {
        wasm: 'application/wasm', glb: 'model/gltf-binary',
        png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif',
        webp: 'image/webp', avif: 'image/avif', bmp: 'image/bmp', ico: 'image/x-icon',
        mp3: 'audio/mpeg', ogg: 'audio/ogg', oga: 'audio/ogg', opus: 'audio/ogg',
        wav: 'audio/wav', flac: 'audio/flac', m4a: 'audio/mp4', aac: 'audio/aac',
        mp4: 'video/mp4', webm: 'video/webm', mov: 'video/quicktime', m4v: 'video/x-m4v',
        ttf: 'font/ttf', otf: 'font/otf', woff: 'font/woff', woff2: 'font/woff2',
      };
      const normalizePath = (raw) => {
        const value = String(raw).split(/[?#]/, 1)[0];
        if (/^[a-z][a-z0-9+.-]*:/i.test(value) || value.startsWith('//')) return null;
        const base = entry.includes('/') ? entry.slice(0, entry.lastIndexOf('/')).split('/') : [];
        const parts = value.startsWith('/') ? [] : base;
        for (const part of value.replace(/^\/+/, '').split('/')) {
          if (!part || part === '.') continue;
          if (part === '..') parts.pop();
          else parts.push(part);
        }
        const resolved = parts.join('/');
        if (Object.prototype.hasOwnProperty.call(assets, resolved)) return resolved;
        const rootRelative = value.replace(/^\.?\/+/, '');
        return Object.prototype.hasOwnProperty.call(assets, rootRelative) ? rootRelative : null;
      };
      const urlCache = Object.create(null);
      const assetsApi = Object.freeze({
        has: (path) => normalizePath(path) !== null,
        list: () => Object.keys(assets),
        bytes: (path) => {
          const key = normalizePath(path);
          return key === null ? null : new Uint8Array(assets[key]);
        },
        url: (path) => {
          const key = normalizePath(path);
          if (key === null) return null;
          if (!urlCache[key]) {
            const extension = key.includes('.') ? key.slice(key.lastIndexOf('.') + 1).toLowerCase() : '';
            urlCache[key] = URL.createObjectURL(new Blob([assets[key]], {
              type: MIME[extension] || 'application/octet-stream',
            }));
          }
          return urlCache[key];
        },
      });
      Object.defineProperty(window, 'peerd', {
        value: Object.freeze({ assets: assetsApi }),
        writable: false,
        configurable: false,
      });
      window.addEventListener('pagehide', () => {
        for (const url of Object.values(urlCache)) URL.revokeObjectURL(url);
      }, { once: true });

      // Replace this entire document with the agent's HTML. document.
      // write + close runs the new doc's <script> tags inline; the
      // current script-frame stays alive until it returns, which is
      // fine (we're about to return anyway).
      document.open();
      // document.open() replaces the old document and its listeners. Install
      // observability before parsing App markup so synchronous violations from
      // initial resources are visible to the trusted parent.
      window.addEventListener('securitypolicyviolation', (event) => {
        window.parent.postMessage({
          type: 'app-policy-blocked',
          directive: String(event.effectiveDirective || 'resource'),
        }, '*');
      });
      document.write(html);
      document.close();

      // Make ordinary media markup work without forcing every App to write a
      // bootstrap script. Script-created consumers and CSS still use the API.
      try {
        const sourceNodes = document.querySelectorAll('img[src],audio[src],video[src],source[src]');
        for (const node of sourceNodes) {
          const raw = node.getAttribute('src');
          const url = raw && assetsApi.url(raw);
          if (url) node.setAttribute('src', url);
        }
        for (const node of document.querySelectorAll('link[rel~="icon"][href]')) {
          const raw = node.getAttribute('href');
          const url = raw && assetsApi.url(raw);
          if (url) node.setAttribute('href', url);
        }
      } catch (_e) { /* the explicit assets API remains available */ }

      // Keep the app INSIDE its sandbox. The manifest CSP is the security
      // boundary: it refuses form actions before any untrusted script runs.
      // This listener is the UX half — it keeps ordinary submit buttons from
      // reloading the frame while still letting the app's own handler fire.
      // `document` here is the app's document (document.write replaced ours),
      // and the listener outlives this script.
      try {
        document.addEventListener('submit', (e) => { e.preventDefault(); }, true);
      } catch (_e) { /* no document — nothing to guard */ }

      // form.submit() bypasses the submit EVENT. Redirect it through a real,
      // cancelable event for the same UX; form-action 'none' independently
      // refuses the network action even if hostile code races or bypasses this.
      try {
        const Form = (document.defaultView || window).HTMLFormElement;
        if (Form && Form.prototype) {
          Form.prototype.submit = function () {
            this.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
          };
        }
      } catch (_e) { /* prototype frozen / no form interface — leave default */ }

      // Links are a user-mediated declassification, not ambient App authority.
      // Keep fragments local; ask the trusted parent to validate + confirm every
      // external HTTP(S) URL. Other schemes and relative cross-page links fail
      // visibly through the same display-only notice.
      try {
        document.addEventListener('click', (event) => {
          const target = event.target instanceof Element
            ? event.target.closest('a[href]')
            : null;
          if (!target) return;
          const raw = target.getAttribute('href') || '';
          if (raw.startsWith('#')) return;
          event.preventDefault();
          window.parent.postMessage({
            type: 'app-link', href: raw, label: (target.textContent || '').trim(),
          }, '*');
        }, true);
      } catch (_e) { /* no DOM — links remain blocked by the sandbox */ }
      });
      port.start();
      // The transferred port is the readiness capability. App code inherits the
      // Window after document.write but never gets a reference to this closure.
      port.postMessage({ type: 'runner-ready' });
    });
  })();
</script>
</body>
</html>
