<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>peerd — home</title>
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'wasm-unsafe-eval'; object-src 'self'">
  <!-- styles.css carries the shared component styling (cards, inputs,
       wordmark, log rows); options.css adds the full-tab content shell
       (readable max-width) + the vault gate this page reuses. -->
  <link rel="stylesheet" href="../sidepanel/styles.css">
  <link rel="stylesheet" href="../options/options.css">
  <!-- home.css: the SPA shell (left rail + content area, DESIGN-12). Loaded
       last so it can layer on the shared component + gate styling. -->
  <link rel="stylesheet" href="./home.css">
</head>
<body>
  <!-- Icon sprite: the SUBSET of the side panel's mono-stroke set this page
       uses (same symbols, copied verbatim: 24-unit grid, 2px stroke, round
       caps, currentColor). <use href="#ic-..."> only resolves same-document,
       so home carries its own copy. why drawn symbols, not unicode glyphs:
       the bell/padlock render as COLOR emoji on most platforms, off-brand on
       a monochrome surface, and drift per-OS; a drawn stroke inherits
       currentColor and renders identically everywhere. Lives outside #app so
       Mithril re-renders never touch it. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="ic-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.6 1.9H4.4z"></path><path d="M10 21.2h4"></path></symbol>
    <symbol id="ic-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9.5" rx="2.2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></symbol>
    <symbol id="ic-set" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 8h7M16 8h3M12 16h7M5 16h3"></path><circle cx="14" cy="8" r="2.1"></circle><circle cx="10" cy="16" r="2.1"></circle></symbol>
    <symbol id="ic-cube" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9"></path></symbol>
    <symbol id="ic-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"></circle><path d="M4 12h16M12 4c2.6 2.3 2.6 13.7 0 16M12 4c-2.6 2.3-2.6 13.7 0 16"></path></symbol>
    <symbol id="ic-ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6.5h9.5V16M17.5 6.5L7 17"></path></symbol>
    <symbol id="ic-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12a7.5 7.5 0 1 1-2.1-5.2M19.5 4v3.6h-3.6"></path></symbol>
    <symbol id="ic-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></symbol>
    <symbol id="ic-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></symbol>
    <symbol id="ic-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></symbol>
    <symbol id="ic-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></symbol>
    <symbol id="ic-key" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="4"></circle><path d="M11 11l8 8M16 16l2-2M19 13l1.5 1.5"></path></symbol>
    <symbol id="ic-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 8l4-4 4 4M5 13v6h14v-6"></path></symbol>
    <symbol id="ic-dots" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="19" cy="12" r="1.7"></circle></symbol>
  </defs></svg>
  <!-- Mithril mounts here (a single named slot, never document.body). -->
  <div id="app">
    <main class="boot-shell" role="status" aria-live="polite" aria-label="Starting peerd">
      <div class="boot-shell__wordmark" aria-hidden="true">peerd</div>
      <p>Starting secure vault…</p>
    </main>
  </div>
  <script type="module" src="./boot.js"></script>
</body>
</html>
