<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tables and charts</title><style>:root{color-scheme:light dark;font:16px/1.5 system-ui}body{max-width:960px;margin:auto;padding:24px}button,input,select,textarea{font:inherit}button,select,input{margin:4px;padding:8px}textarea{width:100%;box-sizing:border-box;min-height:150px}table{border-collapse:collapse}th,td{padding:6px 12px;border:1px solid GrayText;text-align:left}section{margin:20px 0}.scroll{overflow:auto}canvas{max-width:100%;image-rendering:pixelated;border:1px solid GrayText}label{display:block}.row{display:flex;flex-wrap:wrap;gap:18px}.row>div{flex:1;min-width:220px}p{max-width:70ch}output{display:block}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid currentColor;outline-offset:2px}</style><h1>Tables and charts</h1><p>Paste a table, or choose a .csv file. Then pick a column of numbers to see a chart. Your table stays on this device.</p><label>Table file (.csv) <input id="file" type="file" accept=".csv,text/csv"></label><label for="csv">Your table (the first row names the columns)</label><textarea id="csv">Month,Revenue,Costs
January,1200,800
February,1500,950
March,1100,760
April,1800,1050
May,2100,1200</textarea><button id="analyze">Show chart</button><p id="status" role="status"></p><section id="result" hidden><label>Column of numbers <select id="column"></select></label><output id="stats"></output><canvas id="chart" width="800" height="240" aria-label="Bar chart of the chosen column"></canvas><h2>Table preview</h2><div class="scroll"><table id="table"></table></div></section><script type="module" src="./app.js"></script></html>
